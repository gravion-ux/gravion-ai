[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gravion-ai"
version = "0.11.0"
description = "Gravion AI: a modular AI platform framework — many AI types, four tiers, one module system, with a cryptographic licensing and entitlement layer for commercial deployments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Kumar Thakur" },
]
maintainers = [
    { name = "Priyanshu Kumar Thakur", email = "gravion-ux@users.noreply.github.com" },
]
keywords = ["ai", "platform", "framework", "modules", "licensing", "ed25519", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies: cryptography provides the Ed25519 signatures the
# licensing subsystem is built on; Pillow powers local image rendering.
# Everything else is standard library.
dependencies = ["cryptography>=41", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
gravion = "gravion_ai.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/gravion-ai"
Repository = "https://github.com/gravion-ux/gravion-ai"
Issues = "https://github.com/gravion-ux/gravion-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gravion_ai" = ["data/*.json", "data/*.jsonl"]
"gravion_ai.modules.chat" = ["manifest.json"]
"gravion_ai.modules.support" = ["manifest.json"]
"gravion_ai.modules.coder" = ["manifest.json"]
"gravion_ai.modules.image" = ["manifest.json"]
"gravion_ai.modules.music" = ["manifest.json"]
"gravion_ai.modules.video" = ["manifest.json"]
"gravion_ai.modules.website_builder" = ["manifest.json"]
"gravion_ai.modules.cyber" = ["manifest.json"]
"gravion_ai.modules.agentic" = ["manifest.json"]
"gravion_ai.modules.translation" = ["manifest.json"]
"gravion_ai.modules.summarization" = ["manifest.json"]
"gravion_ai.modules.retrieval" = ["manifest.json"]
"gravion_ai.modules.data_analysis" = ["manifest.json"]
"gravion_ai.modules.document_qa" = ["manifest.json"]
"gravion_ai.modules.all_in_one" = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
