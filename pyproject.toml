[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gravion-ai"
version = "0.1.0"
description = "Gravion AI: a modular AI platform framework — many AI types, four tiers, one module system, with a cryptographic licensing and entitlement layer for commercial deployments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Kumar Thakur" },
]
maintainers = [
    { name = "Priyanshu Kumar Thakur", email = "gravion-ux@users.noreply.github.com" },
]
keywords = ["ai", "platform", "framework", "modules", "licensing", "ed25519", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependency: cryptography provides the Ed25519 signatures the
# licensing subsystem is built on. Everything else is standard library.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gravion = "gravion_ai.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/gravion-ai"
Repository = "https://github.com/gravion-ux/gravion-ai"
Issues = "https://github.com/gravion-ux/gravion-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gravion_ai" = ["data/*.json"]
"gravion_ai.modules.chat" = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
